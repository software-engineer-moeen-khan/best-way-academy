services:
  app:
    build: .
    ports: ["8080:80"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: best_way_academy
      DB_USERNAME: bwa
      DB_PASSWORD: bwa_local_password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: admin@localhost.test
      ADMIN_PASSWORD: LocalAdmin123!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: best_way_academy
      MYSQL_USER: bwa
      MYSQL_PASSWORD: bwa_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports: ["33060:3306"]
    volumes: ["bwa_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  bwa_mysql:
