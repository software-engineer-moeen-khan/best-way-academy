<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Certificate — Best Way Academy</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/player.css">
  <link rel="stylesheet" href="assets/responsive-final.css?rev=20260808-responsive-v1">
</head>
<body data-player-page="certificate">
<header class="player-header no-print">
  <a class="brand" href="index.html"><span class="brand-mark">B</span><span>Best Way <b>Academy</b></span></a>
  <a class="player-back" href="my-learning.html">← My Learning</a>
</header>
<main class="certificate-wrap">
  <section class="certificate-card" id="certificateCard">
    <div class="certificate-border">
      <div class="certificate-logo"><span class="brand-mark">B</span><strong>Best Way Academy</strong></div>
      <p class="certificate-overline">CERTIFICATE OF COMPLETION</p>
      <h1>Certificate of Achievement</h1>
      <p class="certificate-copy">This certifies that</p>
      <h2 id="certificateName">Learner</h2>
      <p class="certificate-copy">has successfully completed</p>
      <h3 id="certificateCourse">Course</h3>
      <div class="certificate-meta"><span id="certificateDate">Completed</span><span id="certificateId">Certificate ID</span></div>
      <div class="certificate-signatures"><div><b>Best Way Academy</b><span>Course Provider</span></div><div><b>100%</b><span>Course Completion</span></div></div>
    </div>
  </section>
  <div class="certificate-actions no-print"><button id="printCertificate" class="primary-player" type="button">Print / Save PDF</button><a class="secondary-player" href="my-learning.html">Back to My Learning</a></div>
</main>
<script src="assets/player-loader.js"></script>
</body>
</html>
