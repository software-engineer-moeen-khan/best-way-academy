<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage your Best Way Academy account"><title>Account Settings — Best Way Academy</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="account"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">B</span><span>Best Way <b>Academy</b></span></a><nav class="desktop-nav"><a href="/courses">Explore</a><a href="/my-learning">My Learning</a><a href="/plans">Plans</a></nav><div class="header-actions"><a class="login" href="/dashboard">Dashboard</a></div></header><main class="product-page"><div class="product-shell"><section class="product-hero"><p class="eyebrow">ACCOUNT</p><h1>Profile & settings</h1><p>Manage your learner profile, language, appearance and notification preferences.</p></section><div class="settings-grid" style="margin-top:25px"><nav class="settings-nav"><a class="active" href="#profile">Profile</a><a href="/orders">Purchase history</a><a href="/plans">Subscriptions</a><a href="/notifications">Notifications</a><a href="/messages">Messages</a></nav><section class="settings-panel" id="profile"><form id="accountForm"><div class="setting-row"><label for="accountName">Name</label><input id="accountName" autocomplete="name" required></div><div class="setting-row"><label for="accountEmail">Email</label><input id="accountEmail" type="email" autocomplete="email" required></div><div class="setting-row"><label for="accountLanguage">Language</label><select id="accountLanguage"><option>English</option><option>Urdu</option><option>Arabic</option><option>Hindi</option></select></div><div class="setting-row"><label>Appearance</label><div class="switch-row"><span>Dark mode</span><input id="darkMode" type="checkbox"></div></div><div class="setting-row"><label>Notifications</label><div class="switch-row"><span>Email learning reminders</span><input id="emailNotifications" type="checkbox" checked></div></div><div class="settings-actions"><button class="suite-primary" type="submit">Save settings</button><button class="suite-secondary" type="button" id="logoutAccount">Log out</button></div></form></section></div></div></main><script src="assets/udemy-suite.js"></script></body></html>
