<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Settings — Best Way Academy</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">B</span><span>Best Way <b>Academy</b></span></a><div class="header-actions"><a class="login" href="dashboard.html">Dashboard</a></div></header><main class="product-page"><div class="product-shell"><section class="product-hero"><p class="eyebrow">ACCOUNT</p><h1>Profile & settings</h1><p>Manage your demo learner profile, language, appearance and notification preferences.</p></section><div class="settings-grid" style="margin-top:25px"><nav class="settings-nav"><a class="active" href="#profile">Profile</a><a href="orders.html">Purchase history</a><a href="plans.html">Subscriptions</a><a href="notifications.html">Notifications</a><a href="messages.html">Messages</a></nav><section class="settings-panel" id="profile"><form id="accountForm"><div class="setting-row"><label for="accountName">Name</label><input id="accountName" required></div><div class="setting-row"><label for="accountEmail">Email</label><input id="accountEmail" type="email" required></div><div class="setting-row"><label for="accountLanguage">Language</label><select id="accountLanguage"><option>English</option><option>Urdu</option><option>Arabic</option><option>Hindi</option></select></div><div class="setting-row"><label>Appearance</label><div class="switch-row"><span>Dark mode</span><input id="darkMode" type="checkbox"></div></div><div class="setting-row"><label>Notifications</label><div class="switch-row"><span>Email learning reminders</span><input id="emailNotifications" type="checkbox" checked></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="suite-primary" type="submit">Save settings</button><button class="suite-secondary" type="button" id="log
